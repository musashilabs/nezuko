[package]
name = "nezuko"
version = "0.2.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "A mini async runtime for writing reliable applications with Rust."
repository = "https://github.com/musashilabs/nezuko"
documentation = "https://docs.rs/nezuko"
readme = "README.md"
keywords = ["async", "runtime", "executor", "futures", "reactor"]
categories = ["asynchronous", "concurrency", "network-programming"]
exclude = [
    ".github/",
    ".githooks/",
    ".config/",
    "Makefile",
    "clippy.toml",
    "deny.toml",
    "rustfmt.toml",
    "rust-toolchain.toml",
]

[dependencies]
thiserror = "2.0.19"
libc = "0.2.186"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "runtime"
harness = false