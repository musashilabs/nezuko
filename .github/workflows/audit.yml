name: audit

on:
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "deny.toml"
  schedule:
    - cron: "17 6 * * *"          # daily, off the hour to dodge congestion
  workflow_dispatch:

permissions:
  contents: read
  issues: write                    # rustsec/audit-check opens an issue on advisories

jobs:
  # -------------------------------------------------------------------------
  # audit-check builds cargo-audit from source, so it needs a toolchain new
  # enough for cargo-audit's OWN dependencies — which has nothing to do with
  # our MSRV. rust-toolchain.toml pins the MSRV and rustup honours that over
  # `rustup default`, so RUSTUP_TOOLCHAIN is what actually selects stable here.
  # Without it the build dies on kstring 2.0.4, which requires 1.96.
  # -------------------------------------------------------------------------
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------
  # cargo-deny-action ships a prebuilt binary — no source build, so it needs no
  # toolchain of its own and is unaffected by the pin above.
  # -------------------------------------------------------------------------
  deny:
    name: cargo deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, bans, licenses, sources]
    # advisories can flap when the RustSec DB moves — don't nuke a merge over it
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
