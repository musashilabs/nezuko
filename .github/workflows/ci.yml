name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0 # useless on clean CI, disable for smaller cache
  CARGO_PROFILE_DEV_DEBUG: 0 # skip debuginfo — significantly faster
  CARGO_PROFILE_TEST_DEBUG: 0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

# NOTE ON TOOLCHAIN SELECTION
# rust-toolchain.toml pins 1.97.1 for local dev, and rustup honours that file
# over `rustup default` — so installing a toolchain here is NOT enough to use
# it. Every job must set RUSTUP_TOOLCHAIN, which is the only thing that
# overrides the pin. Without it the whole matrix silently collapses onto the
# pinned toolchain and the stable/beta cells test nothing.

jobs:
  # -------------------------------------------------------------------------
  # Fast fail — fmt is seconds, so gate the rest on it.
  # -------------------------------------------------------------------------
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all -- --check

  # -------------------------------------------------------------------------
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: fmt
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: clippy }
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  # -------------------------------------------------------------------------
  test:
    name: test / ${{ matrix.os }} / ${{ matrix.toolchain }}
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          # - windows-latest # disabled: unix-only (libc / fd-based reactor)
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: beta
          - os: ubuntu-latest
            toolchain: "1.97.0" # MSRV — keep in sync with Cargo.toml rust-version
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}-${{ matrix.toolchain }}
      - uses: taiki-e/install-action@nextest
      - name: verify active toolchain
        run: rustc -vV
      - run: cargo nextest run --all-features --locked --profile ci
      - name: doc-tests
        run: cargo test --doc --all-features --locked

  # -------------------------------------------------------------------------
  docs:
    name: docs
    runs-on: ubuntu-latest
    needs: fmt
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: docs }
      - run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  # -------------------------------------------------------------------------
  # single gate job for branch protection — instead of listing every matrix
  # cell in GitHub's required-checks UI, require only this one.
  # -------------------------------------------------------------------------
  gate:
    name: gate
    if: always()
    needs: [fmt, clippy, test, docs]
    runs-on: ubuntu-latest
    steps:
      - name: verify all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "one or more jobs failed"; exit 1
          fi
