name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crate:
    name: publish to crates.io
    runs-on: ubuntu-latest
    environment: release
    # see ci.yml — rust-toolchain.toml pins the MSRV, so RUSTUP_TOOLCHAIN is what
    # actually selects stable for the publish build.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: verify version matches tag
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$tag" != "$crate" ]; then
            echo "tag $tag ≠ Cargo.toml $crate"; exit 1
          fi
      # --locked: publish exactly the dependency graph CI tested.
      # token via env, not argv — argv is visible in the runner process list.
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: github release
    runs-on: ubuntu-latest
    needs: publish-crate
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: generate notes
        id: notes
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          {
            echo "notes<<EOF"
            if [ -n "$prev" ]; then
              git log --pretty=format:'- %s (%h)' "$prev..HEAD"
            else
              git log --pretty=format:'- %s (%h)'
            fi
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
